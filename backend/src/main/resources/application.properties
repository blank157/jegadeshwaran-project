# Application
spring.application.name=swift-mt-backend
server.port=8080

# MySQL Database Configuration (auto-creates database if MySQL is running)
spring.datasource.url=jdbc:mysql://localhost:3306/swift_mt_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:SwiftMT2024SecretKeyForJWTTokenGenerationMustBe256BitsLongForHmacSha256Algorithm}
app.jwt.expiration=86400000

# Logging
logging.level.com.swiftmt=INFO
logging.level.org.springframework.security=WARN

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
